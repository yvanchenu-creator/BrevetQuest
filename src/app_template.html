<title>BrevetQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column centred on larger screens; screens swap in place (accueil, quiz, bilan) */
:root{
  --bg:#0F1426; --panel:#1A2140; --panel2:#141B34; --line:#2B3360; --fg:#F4F6FF; --muted:#A9B1D6; --soft:#DDE2F7;
  --accent:#D4FF3A; --ink:#11160A; --flame:#FF8A3D; --flamebg:#2A1C12; --flametext:#FFB27A;
  --ok:#3DDC97; --okbg:#10392A; --oktext:#7FF0BF; --ko:#FF7A7A; --kobg:#3F1A22; --kotext:#FFA3A3;
  --maths:#5B8CFF; --fr:#FF6B9A; --hg:#FFA94D; --sc:#3DDC97;
  --display:'Space Grotesk',system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
h1,h2,.display{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.streak{display:flex;align-items:center;gap:6px;background:var(--flamebg);border:1px solid var(--flame);border-radius:999px;padding:8px 14px;color:var(--flametext);font-weight:700}
.streak.off{background:var(--panel);border-color:var(--line);color:var(--muted)}
.streak b{font-family:var(--display);font-size:18px}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.thin{height:6px}
.hero{background:var(--accent);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero .tag{font-size:12px;font-weight:700;background:var(--ink);color:var(--accent);border-radius:999px;padding:4px 10px}
.hero h2{font-size:22px;line-height:1.15}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:52px;border-radius:15px;border:none;font-weight:700;font-size:16px;cursor:pointer;width:100%}
.btn.dark{background:var(--ink);color:var(--fg)}
.btn.main{background:var(--accent);color:var(--ink)}
.btn.ghost{background:var(--panel);border:2px solid var(--line);color:var(--fg)}
.btn[disabled]{opacity:.55;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subj{background:var(--panel);border:none;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-height:44px}
.subj .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.subj .name{font-weight:700;font-size:15px}
.top{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel);border:none;color:var(--muted);cursor:pointer}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);border-radius:999px;padding:5px 12px}
.qtext{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.25}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line);text-align:left;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.choice .l{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice.good{background:var(--okbg);border-color:var(--ok)}
.choice.bad{background:var(--kobg);border-color:var(--ko)}
.choice.dim{background:var(--panel2);border-color:#232B52;color:#8F97BE}
.choice[disabled]{cursor:default}
.feedback{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.good{background:var(--okbg);color:var(--oktext)}
.feedback.bad{background:var(--kobg);color:var(--kotext)}
.feedback p{margin:0;color:var(--soft);font-size:14px}
.feedback .src{font-size:12px;color:var(--muted)}
.detail{background:var(--panel);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.detail h3{font-family:var(--display);font-size:16px;margin:0}
.detail ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--soft)}
.detail li::marker{color:var(--accent);font-weight:700}
.retenir{background:var(--panel2);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.retenir b{color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.schema{width:100%;max-width:380px;height:auto;align-self:center;display:block}
.stable{border-collapse:collapse;max-width:100%;align-self:center;font-variant-numeric:tabular-nums}
.stable td,.stable th{border:1px solid var(--line);padding:8px 12px;text-align:center;font-size:15px}
.stable th{color:var(--muted);font-weight:600}
@media(max-width:480px){.stable td,.stable th{padding:6px 7px;font-size:13px}}
.stable .hl{color:var(--accent);font-weight:700}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;padding:8px 0;align-self:flex-start;min-height:44px}
.big{font-family:var(--display);font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.center{text-align:center;align-items:center}
.save{font-size:12px;color:var(--muted);text-align:center}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar>i{transition:none}}
</style>

<div class="app" id="app"></div>

<script>
const DATA = __DATA__;
const BANK = DATA.questions;
const DOMAINS = DATA.domaines || {};
const SUBJECTS = [
  {id:"Maths", color:"var(--maths)", icon:'<path d="M5 12h14M12 5v14"/>'},
  {id:"Français", color:"var(--fr)", icon:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>'},
  {id:"Histoire-Géo", color:"var(--hg)", icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'},
  {id:"Sciences", color:"var(--sc)", icon:'<path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>'}
];
const COLOR = Object.fromEntries(SUBJECTS.map(s => [s.id, s.color]));
const LEVELS = ["Débutant","Apprenti","Explorateur","Stratège","Expert","Maître","Champion","Légende"];
const INTERVALS = [1, 3, 7, 15, 30]; // jours avant de revoir une question, selon sa « boîte »
const FLAME = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-5 0-9z"/></svg>';
const LOCAL_KEY = "brevetquest-progress";

/* ---------- dates ---------- */
const dayStr = d => { const z = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); };
const today = () => dayStr(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return dayStr(new Date(y, m-1, d+n)); };

/* ---------- progression ---------- */
const empty = () => ({xp:0, streak:0, best:0, lastDay:null, days:{}, stats:{}});
let P = empty();
try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) P = Object.assign(empty(), JSON.parse(raw)); } catch(e) {}
let ref = null, mode = "local", readOnly = false, chain = Promise.resolve();

function save(){
  const body = JSON.parse(JSON.stringify(P));
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(body)); } catch(e) {}
  if (ref && !readOnly) chain = chain.then(() => ref.set(body)).catch(e => {
    if (e && e.code === "invalid_argument") { readOnly = true; mode = "local"; }
  });
}

function level(xp){ // niveau n atteint à 50·(n-1)² XP
  const n = Math.floor(Math.sqrt(xp/50)) + 1;
  const lo = 50*(n-1)**2, hi = 50*n**2;
  return {n, name: LEVELS[Math.min(n-1, LEVELS.length-1)], lo, hi, pct: Math.round((xp-lo)/(hi-lo)*100)};
}
function liveStreak(){
  if (!P.lastDay) return 0;
  const t = today();
  return (P.lastDay === t || P.lastDay === addDays(t,-1)) ? P.streak : 0;
}
function mastery(subject, domain){
  const qs = BANK.filter(q => q.matiere === subject && (!domain || q.domaine === domain));
  const pts = qs.reduce((s,q) => { const st = P.stats[q.id]; return s + (st ? Math.min(st.box||0, 3) : 0); }, 0);
  return Math.round(pts / (qs.length*3) * 100);
}
function dailyDone(){ const d = P.days[today()]; return !!(d && d.mix); }

/* ---------- choix des questions ---------- */
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function rank(q){ // plus petit = plus prioritaire
  const st = P.stats[q.id], t = today();
  if (!st) return 1 + Math.random();
  if (st.due <= t) return Math.random();
  return 2 + (st.box||0) + Math.random();
}
function pick(subject, n, domain){
  if (subject) return BANK.filter(q => q.matiere === subject && (!domain || q.domaine === domain)).sort((a,b) => rank(a)-rank(b)).slice(0,n);
  const out = SUBJECTS.map(s => BANK.filter(q => q.matiere === s.id).sort((a,b) => rank(a)-rank(b))[0]);
  const rest = BANK.filter(q => !out.includes(q)).sort((a,b) => rank(a)-rank(b));
  return shuffle(out.concat(rest.slice(0, n-out.length)));
}

/* ---------- écrans ---------- */
const app = document.getElementById("app");
let S = {screen:"home"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if (S.screen === "home") renderHome();
  else if (S.screen === "quiz") renderQuiz();
  else if (S.screen === "badges") renderBadges();
  else if (S.screen === "subject") renderSubject();
  else if (S.screen === "parent") renderParent();
  else renderEnd();
}

/* ---------- badges ---------- */
const correctIn = subj => BANK.filter(q => q.matiere === subj).reduce((s,q) => s + ((P.stats[q.id] && P.stats[q.id].ok) || 0), 0);
const totalOk = () => Object.values(P.stats).reduce((s,x) => s + (x.ok||0), 0);
const BADGES = [
  {id:"first", name:"Premier pas", desc:"Terminer ta première session", color:"var(--accent)", test:() => (P.sessions||0) >= 1},
  {id:"daily", name:"Fidèle au poste", desc:"Réussir 5 défis du jour", color:"var(--accent)", test:() => Object.values(P.days).filter(d => d.mix).length >= 5},
  {id:"s3", name:"Ça chauffe", desc:"3 jours d'affilée", color:"var(--flame)", test:() => (P.best||0) >= 3},
  {id:"s7", name:"Semaine en feu", desc:"7 jours d'affilée", color:"var(--flame)", test:() => (P.best||0) >= 7},
  {id:"s30", name:"Inarrêtable", desc:"30 jours d'affilée", color:"var(--flame)", test:() => (P.best||0) >= 30},
  {id:"perfect", name:"Sans faute", desc:"Une session parfaite", color:"#8C7BFF", test:() => (P.perfect||0) >= 1},
  {id:"perfect10", name:"Machine de précision", desc:"10 sessions parfaites", color:"#8C7BFF", test:() => (P.perfect||0) >= 10},
  {id:"comeback", name:"La revanche", desc:"Réussir 5 questions que tu avais ratées", color:"#5BE7FF", test:() => (P.comebacks||0) >= 5},
  {id:"maths", name:"Matheux", desc:"15 bonnes réponses en maths", color:"var(--maths)", test:() => correctIn("Maths") >= 15},
  {id:"fr", name:"Plume d'or", desc:"15 bonnes réponses en français", color:"var(--fr)", test:() => correctIn("Français") >= 15},
  {id:"hg", name:"Historien en herbe", desc:"15 bonnes réponses en histoire-géo", color:"var(--hg)", test:() => correctIn("Histoire-Géo") >= 15},
  {id:"sc", name:"Savant fou", desc:"15 bonnes réponses en sciences", color:"var(--sc)", test:() => correctIn("Sciences") >= 15},
  {id:"allround", name:"Touche-à-tout", desc:"50 % de maîtrise dans les 4 matières", color:"var(--accent)", test:() => SUBJECTS.every(s => mastery(s.id) >= 50)},
  {id:"c100", name:"Centurion", desc:"100 bonnes réponses", color:"#FFC93D", test:() => totalOk() >= 100},
  {id:"lvl5", name:"Expert", desc:"Atteindre le niveau 5", color:"#FFC93D", test:() => level(P.xp).n >= 5}
];
const MEDAL = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F1426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>';
function checkBadges(){
  P.badges = P.badges || {};
  const fresh = [];
  BADGES.forEach(b => { if (!P.badges[b.id] && b.test()) { P.badges[b.id] = today(); fresh.push(b); } });
  return fresh;
}
function badgeCard(b, on){
  return `<div class="card" style="align-items:center;text-align:center;gap:6px;${on ? "" : "opacity:.45"}">
    <span style="width:52px;height:52px;border-radius:50%;background:${on ? b.color : "var(--line)"};display:flex;align-items:center;justify-content:center">${MEDAL}</span>
    <span style="font-weight:700;font-size:14px">${esc(b.name)}</span><span class="muted small">${esc(b.desc)}</span></div>`;
}
function backBar(title){
  return `<div class="top"><button class="iconbtn" id="back" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h1 style="font-size:24px">${title}</h1></div>`;
}
function renderBadges(){
  const got = BADGES.filter(b => P.badges && P.badges[b.id]).length;
  app.innerHTML = backBar("Mes badges") + `<span class="muted">${got} sur ${BADGES.length} débloqués</span>
    <div class="grid2">${BADGES.map(b => badgeCard(b, P.badges && P.badges[b.id])).join("")}</div>`;
  document.getElementById("back").onclick = () => { S = {screen:"home"}; render(); };
}

/* ---------- espace parent ---------- */
function renderParent(){
  const t = today(), week = [...Array(7)].map((_,i) => addDays(t, i-6));
  const wd = week.map(d => Object.assign({n:0, ok:0, sec:0}, P.days[d]));
  const active = wd.filter(d => d.n > 0).length, mins = Math.round(wd.reduce((s,d) => s + d.sec, 0) / 60);
  const wn = wd.reduce((s,d) => s + d.n, 0), wok = wd.reduce((s,d) => s + d.ok, 0);
  const maxMin = Math.max(1, ...wd.map(d => d.sec / 60));
  const subj = SUBJECTS.map(s => {
    let ok = 0, n = 0; BANK.filter(q => q.matiere === s.id).forEach(q => { const st = P.stats[q.id]; if (st){ ok += st.ok||0; n += (st.ok||0) + (st.ko||0); } });
    return {s, ok, n, pct: n ? Math.round(ok/n*100) : null};
  });
  const themes = {};
  BANK.forEach(q => { const st = P.stats[q.id]; if (!st) return; const k = q.matiere + " · " + (q.domaine || q.theme); const o = themes[k] = themes[k] || {ok:0, n:0}; o.ok += st.ok||0; o.n += (st.ok||0) + (st.ko||0); });
  const weak = Object.entries(themes).filter(([,o]) => o.n >= 2 && o.ok/o.n < 0.6).sort((a,b) => a[1].ok/a[1].n - b[1].ok/b[1].n).slice(0,5);
  const seen = Object.keys(P.stats).length;
  const dayName = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd).toLocaleDateString("fr-FR", {weekday:"short"}).slice(0,3); };
  app.innerHTML = backBar("Espace parent") + `
    <span class="muted">Suivi de Gabriel sur les 7 derniers jours</span>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div class="card" style="gap:2px"><span class="display" style="font-size:22px">${active} / 7</span><span class="muted small">jours actifs</span></div>
      <div class="card" style="gap:2px"><span class="display" style="font-size:22px">${mins} min</span><span class="muted small">de révision</span></div>
      <div class="card" style="gap:2px"><span class="display" style="font-size:22px">${wn ? Math.round(wok/wn*100) + " %" : "–"}</span><span class="muted small">de réussite</span></div>
    </div>
    <div class="card">
      <span class="display" style="font-size:16px">Minutes par jour</span>
      <div style="display:flex;align-items:flex-end;gap:8px;height:120px" role="img" aria-label="Minutes de révision par jour sur 7 jours">
        ${wd.map((d,i) => { const m = Math.round(d.sec/60); return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%">
          <span class="small muted" style="font-variant-numeric:tabular-nums">${m || ""}</span>
          <div style="width:100%;height:${d.n ? Math.max(6, Math.round(d.sec/60/maxMin*80)) : 4}px;background:${d.n ? "var(--accent)" : "var(--line)"};border-radius:6px"></div>
          <span class="small muted">${dayName(week[i])}</span></div>`; }).join("")}
      </div>
    </div>
    <div class="card">
      <span class="display" style="font-size:16px">Réussite par matière</span>
      ${subj.map(x => `<div class="row"><span style="width:100px;font-size:14px">${esc(x.s.id)}</span>
        <div class="bar thin" style="flex:1"><i style="width:${x.pct || 0}%;background:${x.s.color}"></i></div>
        <span style="width:44px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums">${x.pct === null ? "–" : x.pct + " %"}</span></div>`).join("")}
      <span class="muted small">${seen} questions vues sur ${BANK.length} · ${P.xp} XP · niveau ${level(P.xp).n} · record de série ${P.best||0} jour${(P.best||0)>1?"s":""}</span>
    </div>
    <div class="card" style="background:var(--flamebg);border:1px solid var(--flame)">
      <span class="display" style="font-size:16px;color:var(--flametext)">Points faibles à surveiller</span>
      ${weak.length ? weak.map(([k,o]) => `<span style="font-size:14px">${esc(k)} : ${o.ok} sur ${o.n} réussies</span>`).join("")
        : `<span class="small" style="color:var(--soft)">Pas encore assez de réponses pour repérer des points faibles. Il faut au moins 2 réponses sur un même thème.</span>`}
    </div>`;
  document.getElementById("back").onclick = () => { S = {screen:"home"}; render(); };
}

function renderHome(){
  const lv = level(P.xp), st = liveStreak(), mix = dailyDone();
  const date = new Date().toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  const t = today(), due = BANK.filter(q => P.stats[q.id] && P.stats[q.id].due <= t).length;
  app.innerHTML = `
    <div class="row between">
      <div><div class="muted small" style="text-transform:capitalize">${esc(date)}</div><h1 style="font-size:28px">Salut Gabriel !</h1></div>
      <div class="streak ${st ? "" : "off"}" title="Jours d'affilée">${FLAME}<b>${st}</b><span class="small">jour${st>1?"s":""}</span></div>
    </div>
    <div class="card">
      <div class="row between"><span class="display" style="font-size:17px">Niveau ${lv.n} · ${lv.name}</span><span class="muted small">${P.xp} / ${lv.hi} XP</span></div>
      <div class="bar"><i style="width:${lv.pct}%"></i></div>
      <span class="muted small">Plus que ${lv.hi - P.xp} XP pour passer niveau ${lv.n+1}${P.best ? " · record de série : " + P.best + " jours" : ""}</span>
    </div>
    <div class="hero">
      <div class="row between"><span class="eyebrow">Défi du jour</span><span class="tag">${mix ? "Fait !" : "x2 XP"}</span></div>
      <h2>${mix ? "Défi réussi aujourd'hui. Reviens demain pour garder ta série !" : "Mix du jour : 5 questions, toutes matières"}</h2>
      <span style="font-size:14px">${mix ? "Tu peux continuer à t'entraîner par matière." : "Environ 5 minutes · tirées des sujets du brevet"}</span>
      <button class="btn dark" id="goMix">${mix ? "Refaire un mix" : "C'est parti"}</button>
    </div>
    ${due ? `<button class="btn ghost" id="goDue">Revoir mes ${due} question${due>1?"s":""} ratée${due>1?"s":""}</button>` : ""}
    <div class="row between"><h2 style="font-size:19px">Mes matières</h2><span class="muted small">Brevet en juin 2027</span></div>
    <div class="grid2">

function start(subject, isDaily, domain){
  S = {screen:"quiz", subject, domain: domain || null, daily:isDaily, qs:pick(subject, 5, domain), i:0, picked:null, ok:0, xp:0, t0:Date.now()};
  render(); window.scrollTo(0,0);
}
function startDue(){
  const t = today();
  const qs = shuffle(BANK.filter(q => P.stats[q.id] && P.stats[q.id].due <= t)).slice(0,5);
  S = {screen:"quiz", subject:null, daily:false, qs, i:0, picked:null, ok:0, xp:0, t0:Date.now()};
  render(); window.scrollTo(0,0);
}

function renderQuiz(){
  const q = S.qs[S.i], answered = S.picked !== null, good = answered && S.picked === q.reponse;
  const pct = Math.round((S.i + (answered?1:0)) / S.qs.length * 100), last = S.i === S.qs.length-1;
  app.innerHTML = `
    <div class="top">
      <button class="iconbtn" id="quit" aria-label="Quitter la session"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="bar" style="flex:1"><i style="width:${pct}%"></i></div>
      <span class="display" style="color:var(--accent);font-size:15px">${S.xp} XP</span>
    </div>
    <div class="row"><span class="pill" style="background:${COLOR[q.matiere]}">${esc(q.matiere)}</span><span class="muted small">${esc(q.domaine || q.theme)} · ${S.i+1} sur ${S.qs.length}</span></div>
    <div class="qtext">${esc(q.question)}</div>
    <div class="choices">
      ${q.choix.map((c,k) => {
        let cls = "";
        if (answered) cls = k === q.reponse ? "good" : (k === S.picked ? "bad" : "dim");
        return `<button class="choice ${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span><span>${esc(c)}</span></button>`;
      }).join("")}
    </div>
    ${answered ? `<div class="feedback ${good ? "good" : "bad"} pop">
        <strong class="display" style="font-size:18px">${good ? "Bien joué ! +" + gain(true) + " XP" : "Pas tout à fait… +" + gain(false) + " XP pour l'effort"}</strong>
        <p>${esc(q.explication)}</p><span class="src">${esc(q.source)}</span></div>
      ${detailBlock(q, !good || S.showDetail)}
      <button class="btn main" id="next">${last ? "Voir mon bilan" : "Question suivante"}</button>` : ""}`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById("quit").onclick = () => { S = {screen:"home"}; render(); };
  const sd = document.getElementById("showDetail"); if (sd) sd.onclick = () => { S.showDetail = true; render(); };
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => {
    if (last) finish(); else { S.i++; S.picked = null; S.showDetail = false; render(); window.scrollTo(0,0); }
  };
}
function gain(good){ return (good ? 10 : 2) * (S.daily ? 2 : 1); }

/* ---------- correction détaillée et schémas ---------- */
function detailBlock(q, open){
  const d = q.detail;
  if (!d) return "";
  if (!open) return `<button class="linkbtn" id="showDetail">Voir la correction détaillée</button>`;
  return `<div class="detail pop">
    ${d.schema ? schema(d.schema) : ""}
    ${d.etapes && d.etapes.length ? `<h3>Correction pas à pas</h3><ol>${d.etapes.map(e => `<li>${esc(e)}</li>`).join("")}</ol>` : ""}
    ${d.retenir ? `<div class="retenir"><b>À retenir</b><span>${esc(d.retenir)}</span></div>` : ""}
  </div>`;
}

const K = {line:"#DDE2F7", mut:"#A9B1D6", acc:"#D4FF3A", fill:"#2B3360", ok:"#3DDC97", blue:"#5B8CFF", pink:"#FF6B9A", orange:"#FFA94D"};
const tx = (x, y, t, o = {}) => `<text x="${x}" y="${y}" fill="${o.c || K.line}" font-size="${o.s || 14}" font-weight="${o.w || 600}" text-anchor="${o.a || "middle"}" dominant-baseline="middle" font-family="Inter,system-ui,sans-serif">${esc(t)}</text>`;
const ln = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c || K.line}" stroke-width="${o.w || 2.5}" stroke-linecap="round"${o.d ? ` stroke-dasharray="${o.d}"` : ""}/>`;
const lc = v => v && String(v).includes("?") ? K.acc : K.line;
const svg = (inner, h = 200, w = 300) => `<svg class="schema" viewBox="0 0 ${w} ${h}" role="img" aria-label="Schéma de la correction">${inner}</svg>`;

function schema(s){
  try { return (SCHEMAS[s.type] || (() => ""))(s); } catch(e) { return ""; }
}
const SCHEMAS = {
  tri_rect(s){ // angle droit en A (bas gauche), B en haut, C à droite
    const [a, b, c] = s.pts || ["A","B","C"], k = s.cotes || {};
    const ab = k[a+b] || k[b+a], ac = k[a+c] || k[c+a], bc = k[b+c] || k[c+b];
    let arc = "";
    if (s.angle === b) arc = `<path d="M100,65 A30,30 0 0 0 119,58" fill="none" stroke="${K.acc}" stroke-width="2.5"/>`;
    if (s.angle === c) arc = `<path d="M235,165 A35,35 0 0 1 241,143" fill="none" stroke="${K.acc}" stroke-width="2.5"/>`;
    return svg(`<polygon points="100,165 100,35 270,165" fill="${K.fill}" stroke="${K.line}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M100,150 h15 v15" fill="none" stroke="${K.line}" stroke-width="2"/>${arc}
      ${tx(88,175,a)}${tx(88,28,b)}${tx(282,175,c)}
      ${ab ? tx(88,100,ab,{c:lc(ab),a:"end"}) : ""}${ac ? tx(185,186,ac,{c:lc(ac)}) : ""}${bc ? tx(192,88,bc,{c:lc(bc),a:"start"}) : ""}`, 200);
  },
  thales(s){
    const k = s.cotes || {};
    return svg(`<polygon points="150,25 40,175 260,175" fill="${K.fill}" stroke="${K.line}" stroke-width="2.5" stroke-linejoin="round"/>
      ${ln(84,115,216,115,{c:K.acc})}${ln(40,175,260,175,{c:K.acc})}
      ${tx(150,14,"A")}${tx(70,115,"M")}${tx(230,115,"N")}${tx(30,182,"B")}${tx(270,182,"C")}
      ${tx(150,105,"(MN) // (BC)",{c:K.acc,s:12})}
      ${tx(150,205,Object.entries(k).map(([n,v]) => n + " = " + v).join("  ·  "),{s:13,c:K.line})}`, 215);
  },
  cercle(s){
    const r = s.r ? `${ln(150,100,220,100,{c:K.acc})}${tx(185,88,"r = " + s.r,{c:K.acc})}` : "";
    const d = s.d ? `${ln(80,100,220,100,{c:K.acc})}${tx(150,88,"d = " + s.d,{c:K.acc})}` : "";
    return svg(`<circle cx="150" cy="100" r="70" fill="${s.disque ? K.fill : "none"}" stroke="${K.line}" stroke-width="2.5"/><circle cx="150" cy="100" r="3" fill="${K.line}"/>${tx(140,112,"O",{s:12})}${r}${d}`);
  },
  rect(s){
    return svg(`<rect x="60" y="45" width="180" height="100" rx="2" fill="${K.fill}" stroke="${K.line}" stroke-width="2.5"/>${tx(150,165,s.w,{c:lc(s.w)})}${tx(48,95,s.h,{c:lc(s.h),a:"end"})}`, 180);
  },
  tri_hauteur(s){

      ${ln(110,40,110,165,{c:K.acc,d:"6 5"})}<path d="M110,152 h13 v13" fill="none" stroke="${K.acc}" stroke-width="2"/>
      ${tx(150,185,"base = " + s.b)}${tx(118,105,"hauteur = " + s.h,{c:K.acc,a:"start"})}`, 200);
  },
  solide(s){
    const L = s.labels || {};
    if (s.k === "cube" || s.k === "pave"){

      return svg(`<polygon points="${x},60 ${x+w},60 ${x+w+45},25 ${x+45},25" fill="#232B52" stroke="${K.line}" stroke-width="2"/>
        <polygon points="${x+w},60 ${x+w+45},25 ${x+w+45},135 ${x+w},170" fill="#1F2750" stroke="${K.line}" stroke-width="2"/>
        <rect x="${x}" y="60" width="${w}" height="110" fill="${K.fill}" stroke="${K.line}" stroke-width="2"/>
        ${ln(x,170,x+45,135,{c:K.mut,w:1.5,d:"5 4"})}${ln(x+45,135,x+w+45,135,{c:K.mut,w:1.5,d:"5 4"})}${ln(x+45,25,x+45,135,{c:K.mut,w:1.5,d:"5 4"})}
        ${L.L ? tx(x+w/2,186,L.L) : ""}${L.l ? tx(x+w+38,160,L.l,{a:"start"}) : ""}${L.h ? tx(x-10,115,L.h,{a:"end"}) : ""}`, 200);
    }

      ${ln(120,160,190,160,{c:K.acc})}${tx(155,148,L.r || "r",{c:K.acc})}${ln(208,50,208,160,{c:K.mut,w:1.5})}${tx(216,105,L.h || "h",{a:"start"})}`, 190);

      ${ln(150,30,150,160,{c:K.mut,w:1.5,d:"5 4"})}${ln(150,160,220,160,{c:K.acc})}${tx(185,148,L.r || "r",{c:K.acc})}${tx(158,100,L.h || "h",{a:"start"})}`, 190);
    if (s.k === "pyramide") return svg(`<polygon points="60,160 200,160 250,120 110,120" fill="#232B52" stroke="${K.line}" stroke-width="2"/>

      ${ln(155,30,155,140,{c:K.acc,d:"5 4"})}${tx(147,92,L.h || "h",{c:K.acc,a:"end"})}${tx(130,180,L.base || "base")}`, 195);

    return "";
  },
  urne(s){
    let out = `<path d="M70,40 v120 a20,20 0 0 0 20,20 h120 a20,20 0 0 0 20,-20 v-120" fill="${K.fill}" stroke="${K.line}" stroke-width="2.5"/>`, i = 0;

  },
  polygone(s){

    const [p0, p1] = [pts[0], pts[1]], ex = [p1[0] + (p1[0]-p0[0])*0.6, p1[1] + (p1[1]-p0[1])*0.6];
    return svg(`<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${K.fill}" stroke="${K.line}" stroke-width="2.5" stroke-linejoin="round"/>
      ${ln(p1[0],p1[1],ex[0],ex[1],{c:K.acc,d:"5 4"})}${tx(Math.min(ex[0]+8,290),Math.min(ex[1]-10,188),"tourne de " + s.angle,{c:K.acc,a:"end",s:13})}`, 200);

  droite(s){ // repère -5..5

  },
  barres(s){
    const v = s.vals, max = Math.max(...v), w = 220 / v.length;

      + ln(36,150,264,150,{c:K.mut,w:1.5}) + (s.legende ? tx(150,175,s.legende,{c:K.mut,s:12}) : ""), 185);

  axe(s){ // droite graduée de s.de à s.a, flèche de s.depart, déplacement s.pas

    const e = s.depart + s.pas;

    return svg(`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${K.mut}"/></marker></defs>` + g + (s.legende ? tx(150,192,s.legende,{c:K.mut,s:12}) : ""), 200);
  },
  table(s){
    return `<table class="stable">${s.head ? `<tr>${s.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` : ""}${s.rows.map(r => `<tr>${r.map(c => { const hl = String(c).startsWith("!"); return `<td class="${hl ? "hl" : ""}">${esc(hl ? String(c).slice(1) : c)}</td>`; }).join("")}</tr>`).join("")}</table>`;
  },
  circuit(s){
    const lamp = (x, y) => `<circle cx="${x}" cy="${y}" r="13" fill="${K.fill}" stroke="${K.line}" stroke-width="2"/>${ln(x-9,y-9,x+9,y+9,{w:2})}${ln(x-9,y+9,x+9,y-9,{w:2})}`;
    const pile = `${ln(40,85,40,115,{c:K.fill,w:1})}${ln(30,92,50,92,{w:3})}${ln(34,108,46,108,{w:5})}${tx(22,100,"+",{s:12,c:K.mut})}`;
    if (s.k === "serie") return svg(`${ln(40,40,40,92)}${ln(40,108,40,160)}${ln(40,40,260,40)}${ln(40,160,260,160)}${ln(260,40,260,160)}<rect x="0" y="0" width="0" height="0"/>${pile}<rect x="125" y="27" width="50" height="26" fill="#0F1426"/>${lamp(150,40)}<rect x="237" y="88" width="46" height="26" fill="#0F1426"/>${lamp(260,100)}${tx(150,180,s.legende || "Circuit en série : une seule boucle",{c:K.mut,s:12})}`, 195);
    return svg(`${ln(40,40,40,92)}${ln(40,108,40,160)}${ln(40,40,240,40)}${ln(40,160,240,160)}${ln(150,40,150,160)}${ln(240,40,240,160)}${pile}<rect x="137" y="87" width="26" height="26" fill="#0F1426"/>${lamp(150,100)}<rect x="227" y="87" width="26" height="26" fill="#0F1426"/>${lamp(240,100)}${tx(150,180,s.legende || "Circuit en dérivation : plusieurs boucles",{c:K.mut,s:12})}`, 195);
  },
  frise(s){
    const W = 300, BAR = 86, cw = 6, X = y => 22 + (y - s.de) * 256 / (s.a - s.de);
    const half = t => String(t).length * cw / 2 + 3, cx = (x, t) => Math.min(Math.max(x, half(t) + 2), W - half(t) - 2);
    const lanes = {"-1":[], "-2":[], "1":[], "2":[]}; // derniers intervalles occupés par voie
    const evs = (s.ev || []).slice().sort((p, q) => p[0] - q[0]);
    const fits = (k, l, r) => !lanes[k].some(([a, b]) => l < b + 6 && r > a - 6);
    let maxDown = 0, maxUp = 0, items = [];
    evs.forEach(([y, lab], i) => {
      const x = X(y), lc = cx(x, lab), l = lc - half(lab), r = lc + half(lab);
      const pref = i % 2 === 0 ? [-1, 1, -2, 2] : [1, -1, 2, -2];
      const k = pref.find(k => fits(String(k), l, r)) || pref[0];
      lanes[String(k)].push([l, r]); items.push([y, lab, x, lc, k]);
      if (k > 0) maxDown = Math.max(maxDown, k); else maxUp = Math.max(maxUp, -k);
    });
    const off = maxUp === 2 ? 0 : -36; // remonte tout si une seule voie au-dessus
    const B = BAR + off, yearY = k => k < 0 ? B - 22 - (-k - 1) * 36 : B + 30 + (k - 1) * 36, labY = k => k < 0 ? yearY(k) - 15 : yearY(k) + 15;
    let g = `<rect x="22" y="${B-7}" width="256" height="14" rx="7" fill="${K.fill}"/>`;
    const per = s.periodes || [];
    per.forEach(([d, f, , col]) => { g += `<rect x="${X(d)}" y="${B-7}" width="${Math.max(4, X(f)-X(d))}" height="14" rx="4" fill="${col || K.blue}"/>`; });
    items.forEach(([y, lab, x, lc, k]) => { const hl = y === s.focus, c = hl ? K.acc : K.line;
      g += ln(x, k < 0 ? yearY(k) + 9 : B, x, k < 0 ? B : yearY(k) - 9, {c, w: hl ? 2 : 1.5}); });
    items.forEach(([y, lab, x, lc, k]) => { const hl = y === s.focus, c = hl ? K.acc : K.line;
      g += `<circle cx="${x}" cy="${B}" r="${hl ? 7 : 5}" fill="${c}"/>` + tx(Math.min(Math.max(x, 18), W - 18), yearY(k), y, {c, s:13, w:700}) + tx(lc, labY(k), lab, {c: hl ? K.acc : K.mut, s:11}); });
    let bottom = maxDown ? labY(maxDown) + 12 : B + 14;
    if (per.length){ // légende des périodes, sous la frise
      let lx = 22, ly = bottom + 10;
      per.forEach(([, , lab, col]) => { const w = String(lab).length * cw + 22; if (lx + w > W - 4 && lx > 22){ lx = 22; ly += 18; }
        g += `<rect x="${lx}" y="${ly-5}" width="12" height="10" rx="3" fill="${col || K.blue}"/>` + tx(lx + 17, ly, lab, {s:11, c:K.mut, a:"start"}); lx += w + 8; });
      bottom = ly + 12;
    }
    return svg(g, Math.round(bottom + 4));
  }
};

function answer(k){
  if (S.picked !== null) return;
  const q = S.qs[S.i], good = k === q.reponse, t = today();
  S.picked = k; if (good) S.ok++;
  const g = gain(good); S.xp += g; P.xp += g;
  const st = Object.assign({ok:0, ko:0, box:0}, P.stats[q.id]);
  if (good && st.ko > 0 && st.box === 0) P.comebacks = (P.comebacks||0) + 1;
  if (good){ st.ok++; st.box = Math.min((st.box||0)+1, INTERVALS.length); st.due = addDays(t, INTERVALS[st.box-1]); }
  else { st.ko++; st.box = 0; st.due = addDays(t, 1); }
  st.last = t; P.stats[q.id] = st;
  const d = Object.assign({n:0, ok:0, sec:0}, P.days[t]); d.n++; if (good) d.ok++; P.days[t] = d;
  save(); render();
}

function finish(){
  const t = today(), bonus = 20;
  S.xp += bonus; P.xp += bonus;
  const d = P.days[t]; d.sec = (d.sec||0) + Math.round((Date.now()-S.t0)/1000); if (S.daily) d.mix = true;
  const before = P.lastDay;
  if (before !== t){ P.streak = (before === addDays(t,-1)) ? P.streak + 1 : 1; P.lastDay = t; }
  P.best = Math.max(P.best||0, P.streak);
  S.newStreak = before !== t;
  P.sessions = (P.sessions||0) + 1;
  if (S.ok === S.qs.length) P.perfect = (P.perfect||0) + 1;
  S.newBadges = checkBadges();
  save(); S.screen = "end"; render(); window.scrollTo(0,0);
}

function renderEnd(){
  const lv = level(P.xp), n = S.qs.length;
  const missed = S.qs.filter(q => P.stats[q.id] && P.stats[q.id].box === 0);
  const title = S.ok === n ? "Sans faute, bravo !" : S.ok >= n-1 ? "Presque parfait !" : S.ok >= n/2 ? "Bien joué !" : "Continue, ça rentre !";
  app.innerHTML = `
    <div class="center" style="display:flex;flex-direction:column;gap:6px;padding-top:14px">
      <span class="muted small" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Session terminée</span>
      <h1 style="font-size:32px">${S.ok} sur ${n}. ${title}</h1>
      <span class="big pop">+${S.xp} XP</span>
      <span class="muted small">dont 20 XP de bonus de fin de session${S.daily ? " · défi du jour x2" : ""}</span>
    </div>
    <div class="grid2">
      <div class="card" style="background:var(--flamebg);border:1px solid var(--flame);color:var(--flametext)">
        ${FLAME}<span class="display" style="font-size:26px">${P.streak} jour${P.streak>1?"s":""}</span>
        <span class="small">${S.newStreak ? "Série prolongée !" : "Série déjà validée aujourd'hui"} · record ${P.best}</span>
      </div>
      <div class="card">
        <span class="display" style="font-size:26px">${P.xp} XP</span>
        <span class="muted small">Niveau ${lv.n} · ${lv.name}. Niveau ${lv.n+1} dans ${lv.hi-P.xp} XP</span>
      </div>
    </div>
    ${(S.newBadges||[]).map(b => `<div class="card pop" style="flex-direction:row;align-items:center;gap:14px;border:1px solid ${b.color}">
      <span style="width:56px;height:56px;flex-shrink:0;border-radius:50%;background:${b.color};display:flex;align-items:center;justify-content:center">${MEDAL}</span>
      <div style="display:flex;flex-direction:column;gap:2px"><span class="small muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Nouveau badge</span>
      <span class="display" style="font-size:19px">${esc(b.name)}</span><span class="small" style="color:var(--soft)">${esc(b.desc)}</span></div></div>`).join("")}
    ${missed.length ? `<div class="card"><span class="display" style="font-size:16px">À revoir demain</span>
      ${missed.map(q => `<div class="row"><span style="width:10px;height:10px;border-radius:50%;background:${COLOR[q.matiere]};flex-shrink:0"></span><span class="small">${esc(q.matiere)} · ${esc(q.domaine || q.theme)}</span></div>`).join("")}
      <span class="muted small">Les questions ratées reviennent jusqu'à ce que tu les maîtrises.</span></div>` : ""}
    <div class="row">
      <button class="btn ghost" id="again" style="flex:1">Encore 5</button>
      <button class="btn main" id="home" style="flex:1.4">Retour à l'accueil</button>
    </div>`;
  document.getElementById("again").onclick = () => start(S.subject, false, S.domain);
  document.getElementById("home").onclick = () => { S = {screen:"home"}; render(); };
}

/* ---------- sauvegarde en ligne (Supabase, code famille) ---------- */
const CFG = window.BREVETQUEST_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);
const CODE_KEY = "brevetquest-code";
let CODE = null;
try {
  const m = location.hash.match(/code=([A-Za-z0-9-]{12,64})/);
  if (m){ localStorage.setItem(CODE_KEY, m[1]); history.replaceState(null, "", location.pathname); }
  CODE = localStorage.getItem(CODE_KEY);
} catch(e) {}
let cloudTimer = null, cloudState = "idle";

async function rpc(fn, body){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {"apikey": CFG.supabaseKey, "Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
function cloudSave(){
  if (!CLOUD || !CODE) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => {
    try { await rpc("save_progress", {p_code: CODE, p_data: P}); cloudState = "ok"; }
    catch(e){ cloudState = "offline"; }
    if (S.screen === "home") render();
  }, 1200);
}
async function cloudLoad(){
  if (!CLOUD || !CODE) return;
  try {
    const remote = await rpc("get_progress", {p_code: CODE});
    if (remote && typeof remote === "object" && (remote.xp || 0) >= P.xp){
      P = Object.assign(empty(), remote);
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(P)); } catch(e) {}
    } else if (P.xp > 0) { cloudSave(); }
    cloudState = "ok"; mode = "cloud";
  } catch(e){ cloudState = "offline"; }
  if (S.screen === "home") render();
}
function newCode(){
  const abc = "abcdefghjkmnpqrstuvwxyz23456789", a = new Uint32Array(16);
  crypto.getRandomValues(a);
  const s = Array.from(a, x => abc[x % abc.length]).join("");
  return s.slice(0,4) + "-" + s.slice(4,8) + "-" + s.slice(8,12) + "-" + s.slice(12);
}
function renderSetup(){
  app.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:20px">
      <h1 style="font-size:32px">Bienvenue sur BrevetQuest</h1>
      <p class="muted" style="margin:0">Pour retrouver ta progression sur tous tes appareils, il faut un code famille. Crée-le une seule fois, puis utilise le même code partout.</p>
    </div>
    <button class="btn main" id="mk">Créer un code famille</button>
    <div class="card">
      <label for="codeIn" class="small" style="font-weight:600">J'ai déjà un code</label>
      <input id="codeIn" autocomplete="off" placeholder="xxxx-xxxx-xxxx-xxxx" style="font:16px var(--body);color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px">
      <button class="btn ghost" id="use">Utiliser ce code</button>
      <span class="small" id="err" style="color:var(--kotext)"></span>
    </div>`;
  document.getElementById("mk").onclick = () => setCode(newCode(), true);
  document.getElementById("use").onclick = () => {
    const v = document.getElementById("codeIn").value.trim().toLowerCase();
    if (!/^[a-z0-9-]{12,64}$/.test(v)) { document.getElementById("err").textContent = "Ce code ne semble pas valide. Vérifie les tirets et les lettres."; return; }
    setCode(v, false);
  };
}
function setCode(c, isNew){
  CODE = c; try { localStorage.setItem(CODE_KEY, c); } catch(e) {}
  S = {screen: "home", showCode: isNew}; render(); cloudLoad();
}

const _renderHome = renderHome;
renderHome = function(){
  _renderHome();
  const foot = app.querySelector(".save");
  if (!foot) return;
  if (!CLOUD) { foot.textContent = "Progression sauvegardée sur cet appareil"; return; }
  foot.innerHTML = (cloudState === "offline" ? "Hors ligne : progression gardée sur cet appareil, synchronisation au prochain essai" : "Progression synchronisée en ligne") +
    ` · <button id="showCode" style="background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:6px 2px">Mon code famille</button>`;
  if (S.showCode) {
    const box = document.createElement("div");
    box.className = "card";
    box.innerHTML = `<span class="small muted">Ton code famille, à garder et à entrer sur tes autres appareils :</span><span class="display" style="font-size:22px;color:var(--accent);user-select:all">${esc(CODE)}</span><button class="btn ghost" id="hideCode">C'est noté</button>`;
    foot.before(box);
    document.getElementById("hideCode").onclick = () => { S.showCode = false; render(); };
  }
  document.getElementById("showCode").onclick = () => { S.showCode = true; render(); };
};

const _save = save;
save = function(){ _save(); cloudSave(); };

if (CLOUD && !CODE) renderSetup(); else { render(); cloudLoad(); }
</script>
